name: 掃描並部署

on:
  schedule:
    # GitHub 排程在整點、半點負載高時會延遲或被丟棄，所以避開 :00、:30；
    # 主要觸發來源建議用 cloudflare/ 的 Worker（準時），這裡當備援。每次 run 都會補跑最近漏掉的交易日。
    - cron: "47 7 * * 1-5"    # 台北 15:47：日盤資料
    - cron: "13 9 * * 1-5"    # 台北 17:13：補抓（期交所延遲更新時）
    - cron: "37 22 * * 0-4"   # 台北週一～五 06:37：前一晚夜盤（期交所歸入當日）
    # 結算日盤中快照：台北 09:37、11:07、12:17；每個平日都跑，由程式判斷今天是否為結算日
    - cron: "37 1 * * 1-5"
    - cron: "7 3 * * 1-5"
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run＝單日、backfill＝區間回測、rebuild＝用封存重算、live＝結算日盤中快照、deploy＝只部署"
        type: choice
        options: [run, backfill, rebuild, live, deploy]
        default: run
      date:
        description: "run 用：YYYY-MM-DD（空白＝台北今天）"
        default: ""
      start:
        description: "backfill 用：起日 YYYY-MM-DD"
        default: ""
      end:
        description: "backfill 用：迄日 YYYY-MM-DD"
        default: ""
      expiry_only:
        description: "backfill 只跑週三、週五（結算日）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 結算日盤中快照
        if: ${{ (github.event_name == 'schedule' && contains(fromJSON('["37 1 * * 1-5","7 3 * * 1-5","17 4 * * 1-5"]'), github.event.schedule)) || inputs.mode == 'live' }}
        run: python -m scanner live
      - name: 執行掃描
        if: ${{ (github.event_name == 'schedule' && !contains(fromJSON('["37 1 * * 1-5","7 3 * * 1-5","17 4 * * 1-5"]'), github.event.schedule)) || inputs.mode == 'run' }}
        run: python -m scanner run --date "${{ inputs.date }}"
      - name: 區間回測
        if: ${{ inputs.mode == 'backfill' }}
        run: python -m scanner backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" ${{ inputs.expiry_only && '--expiry-only' || '' }}
      - name: 用封存重算
        if: ${{ inputs.mode == 'rebuild' }}
        run: python -m scanner rebuild

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data archive
          if git diff --cached --quiet; then echo "無新資料"; exit 0; fi
          git commit -m "data: ${{ inputs.mode || 'run' }} $(date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v5
